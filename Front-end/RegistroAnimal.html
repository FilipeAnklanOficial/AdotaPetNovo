<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Animal</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Italiana&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Italianno&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");

      body {
        padding: 0px;
        margin: 0px;
        display: flex;
        align-items: center;
        flex-direction: column;
        background-color: #fff;
      }

      header {
        background-color: white;
        width: 100%;
        padding: 40px 0px 40px 0px;
        align-items: center;
        text-align: center;
        display: flex;
        justify-content: center;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 80px;
      }

      nav > a:hover { text-decoration: underline; }

      nav > a > img {
        height: 70px;
        width: 80px;
      }

      a {
        text-decoration: none;
        color: black;
        font-family: "Courier New", Courier, monospace;
      }

      div#container {
        background-color: white;
        display: flex;
        justify-content: center;
        max-width: 1440px;
        width: 100%;
        padding: 0px 90px 0px 90px;
        margin: 30px 0px 0px 0px;
      }

      div#fotoAnimal {
        background-color: white;
        width: 549px;
        height: 549px;
        margin-right: 107px;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #imagemGrande {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 20px;
        border: 3px solid #36c3ff;
      }

      /* ── Área de miniaturas com controles ── */
      div#cardFotoAnimal {
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        justify-content: center;
        background-color: white;
        width: 550px;
        margin-top: 36px;
        gap: 18px;
      }

      .miniaturaWrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .miniaturaControles {
        display: flex;
        gap: 6px;
      }

      .btnMiniatura {
        width: 52px;
        height: 28px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        transition: opacity 0.2s, transform 0.1s;
      }

      .btnMiniatura:hover { opacity: 0.85; transform: scale(1.05); }
      .btnMiniatura:active { transform: scale(0.97); }

      .btnAdicionar { background-color: #36c3ff; color: white; }
      .btnApagar    { background-color: #ff5c5c; color: white; }

      img.miniatura {
        width: 116px;
        height: 116px;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.3s;
        opacity: 0.8;
        border: 3px solid #36c3ff;
      }

      img.miniatura:hover { opacity: 1; }
      img.miniatura.ativa { opacity: 1; }

      .slotVazio {
        width: 116px;
        height: 116px;
        border-radius: 20px;
        border: 2px dashed #ccd6e0;
        background-color: #f4f8fb;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #aab8c4;
        font-size: 28px;
        cursor: default;
      }

      input.inputArquivo { display: none; }

      div#descricaoAnimal {
        background-color: white;
        width: 603px;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 25%);
      }

      #descricaoAnimal > input {
        width: 100%;
        padding: 14px 18px;
        margin-bottom: 16px;
        background: #f9fbfd;
        border: 1px solid #dce3ea;
        border-radius: 10px;
        box-sizing: border-box;
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 42px;
        color: #222;
      }

      #descricaoAnimal textarea {
        width: 100%;
        min-height: 120px;
        padding: 18px;
        background: #f9fbfd;
        border-radius: 10px;
        border: 1px solid #dce3ea;
        box-sizing: border-box;
        resize: vertical;
        font-size: 16px;
        font-family: "Inter", sans-serif;
      }

      input::placeholder,
      textarea::placeholder {
        font-size: 14px;
        font-weight: 500;
        font-family: "Inter", sans-serif;
      }

      .containerCard {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
        font-family: "Inter", sans-serif;
      }

      div.cardBoxEsquerdo,
      div.cardBoxDireito {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 34px;
        text-align: center;
      }

      div.infoCard1 {
        background-color: white;
        width: 263px;
        height: 50px;
        margin-right: 24px;
        padding-top: 10px;
        padding-bottom: 10px;
        border-width: 1px;
        border-radius: 20px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 25%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      div.infoCard2 {
        background-color: white;
        width: 263px;
        height: 50px;
        margin-left: 24px;
        padding-top: 10px;
        padding-bottom: 10px;
        border-width: 1px;
        border-radius: 20px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 25%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .infoCard1 label,
      .infoCard2 label {
        font-size: 16px;
        color: black;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .infoCard1 input,
      .infoCard2 input,
      .infoCard1 select,
      .infoCard2 select {
        width: 80%;
        height: 100%;
        padding: 1px 2px;
        border: 1px solid #dce3ea;
        border-radius: 10px;
        text-align: center;
        font-size: 14px;
        background: #f9fbfd;
        outline: none;
      }

      #botaoAzul {
        width: 350px;
        height: 59px;
        color: white;
        background-color: #36c3ff;
        border: none;
        border-radius: 40px;
        font-family: "Inter", sans-serif;
        font-weight: bold;
        font-size: 24px;
        display: block;
        text-align: center;
        margin: 38px auto 0 auto;
        line-height: 59px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="login.html">Entrar</a>
        <a href="#">Adotar</a>
        <a href="HomePage.html">
          <img src="imagens/DetalhesAnimal/logoMelhor.png" alt="Logo com desenho e escrito" />
        </a>
        <a href="#">Sobre</a>
        <a href="#">F.A.Q</a>
      </nav>
    </header>

    <div id="container">
      <div id="containerFotosAnimal">
        <div id="fotoAnimal">
          <img id="imagemGrande" />
        </div>

        <!-- Miniaturas com controles -->
        <div id="cardFotoAnimal">

          <!-- Slot 1 -->
          <div class="miniaturaWrapper" id="wrapper-0">
            <div class="miniaturaControles">
              <button class="btnMiniatura btnAdicionar" title="Adicionar imagem" onclick="triggerInput(0)">+ Add</button>
              <button class="btnMiniatura btnApagar"    title="Apagar imagem"    onclick="apagarImagem(0)">✕ Del</button>
            </div>
            <input type="file" accept="image/*" class="inputArquivo" id="input-0" onchange="carregarImagem(this, 0)" />
            <div class="slotVazio">+</div>
          </div>

          <!-- Slot 2 -->
          <div class="miniaturaWrapper" id="wrapper-1">
            <div class="miniaturaControles">
              <button class="btnMiniatura btnAdicionar" title="Adicionar imagem" onclick="triggerInput(1)">+ Add</button>
              <button class="btnMiniatura btnApagar"    title="Apagar imagem"    onclick="apagarImagem(1)">✕ Del</button>
            </div>
            <input type="file" accept="image/*" class="inputArquivo" id="input-1" onchange="carregarImagem(this, 1)" />
            <div class="slotVazio">+</div>
          </div>

          <!-- Slot 3 -->
          <div class="miniaturaWrapper" id="wrapper-2">
            <div class="miniaturaControles">
              <button class="btnMiniatura btnAdicionar" title="Adicionar imagem" onclick="triggerInput(2)">+ Add</button>
              <button class="btnMiniatura btnApagar"    title="Apagar imagem"    onclick="apagarImagem(2)">✕ Del</button>
            </div>
            <input type="file" accept="image/*" class="inputArquivo" id="input-2" onchange="carregarImagem(this, 2)" />
            <div class="slotVazio">+</div>
          </div>

        </div>
      </div>

      <div class="contDescricaoAnimal">
        <div id="descricaoAnimal">
          <input type="text" placeholder="Digite o nome do animal" value="" />
          <textarea placeholder="Descreva o animal aqui"></textarea>
        </div>
        <div class="containerCard">
          <div class="cardBoxEsquerdo">
            <div class="infoCard1">
              <label for="raca">Raça</label>
              <input id="raca" type="text" placeholder="Digite a raça do animal" value="" />
            </div>
            <div class="infoCard1">
              <label for="idade">Idade</label>
              <select id="idade">
                <option value="" selected disabled>Selecione uma opção</option>
                <option value="filhote">Filhote</option>
                <option value="adulto">Adulto</option>
                <option value="idoso">Idoso</option>
              </select>
            </div>
            <div class="infoCard1">
              <label for="localizacao">Tipo de animal</label>
              <select id="localizacao">
                <option value="" selected disabled>Selecione uma opção</option>
                <option value="cachorro">Cachorro</option>
                <option value="gato">Gato</option>
              </select>
            </div>
            <div class="infoCard1">
              <label for="microchip">Possui Microchip?</label>
              <select id="microchip">
                <option value="" selected disabled>Selecione uma opção</option>
                <option value="sim">Sim</option>
                <option value="nao">Não</option>
              </select>
            </div>
          </div>
          <div class="cardBoxDireito">
            <div class="infoCard2">
              <label for="sexo">Sexo</label>
              <select id="sexo">
                <option value="" selected disabled>Selecione uma opção</option>
                <option value="masculino">Macho</option>
                <option value="feminino">Fêmea</option>
              </select>
            </div>
            <div class="infoCard2">
              <label for="porte">Porte do animal</label>
              <select id="porte">
                <option value="" selected disabled>Selecione uma opção</option>
                <option value="pequeno">Pequeno</option>
                <option value="medio">Médio</option>
                <option value="grande">Grande</option>
              </select>
            </div>
            <div class="infoCard2">
              <label for="cor">Cor</label>
              <input id="cor" type="text" placeholder="Digite a cor do animal" value="" />
            </div>
            <div class="infoCard2">
              <label for="vacinado">Vacinado?</label>
              <select id="vacinado">
                <option value="" selected disabled>Selecione uma opção</option>
                <option value="sim">Sim</option>
                <option value="nao">Não</option>
              </select>
            </div>
          </div>
        </div>
        <button id="botaoAzul" type="button">Confirmar Registro</button>
      </div>
    </div>

    <script>
      function trocarImagem(elemento) {
        const imagemGrande = document.getElementById("imagemGrande");
        imagemGrande.src = elemento.src;
        document.querySelectorAll("img.miniatura").forEach(img => img.classList.remove("ativa"));
        elemento.classList.add("ativa");
      }

      function triggerInput(index) {
        document.getElementById("input-" + index).click();
      }

      function carregarImagem(input, index) {
        if (!input.files || !input.files[0]) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          const wrapper = document.getElementById("wrapper-" + index);

          const slotVazio = wrapper.querySelector(".slotVazio");
          if (slotVazio) slotVazio.remove();

          let img = wrapper.querySelector("img.miniatura");
          if (!img) {
            img = document.createElement("img");
            img.className = "miniatura";
            img.onclick = function () { trocarImagem(this); };
            wrapper.appendChild(img);
          }
          img.src = e.target.result;
          trocarImagem(img);
        };
        reader.readAsDataURL(input.files[0]);
      }

      function apagarImagem(index) {
        const wrapper = document.getElementById("wrapper-" + index);
        const img = wrapper.querySelector("img.miniatura");

        if (!img) return;

        const eraAtiva = img.classList.contains("ativa");
        img.remove();

        document.getElementById("input-" + index).value = "";

        const slot = document.createElement("div");
        slot.className = "slotVazio";
        slot.textContent = "+";
        wrapper.appendChild(slot);

        if (eraAtiva) {
          const imagemGrande = document.getElementById("imagemGrande");
          imagemGrande.src = "";
          const outra = document.querySelector("img.miniatura");
          if (outra) trocarImagem(outra);
        }
      }
    </script>
  </body>
</html>
