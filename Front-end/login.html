<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        body{
            font-family: "Inter", "Courier Prime", sans-serif;
            margin: 0px;
        }

        header{
            width: 100%;
            padding: 38px 0px 17px 0px;
        }

        nav{
            height: 18px;
            text-align: end;
        }

        #container{
            width: 100%;
            height: fit-content;

            background-color: white;
            align-items: center;
            justify-content: center;
            display: flex;  
        }

        div#containerImagemEDiv{
            background-color: white;
            display: flex;
            flex-direction: column;
        }

        img{
            width: 629px;
            height: 929px;
            
            margin: 0px 0px 2px 506px;
        }

        #div1{
            font-family: "Inter", sans-serif;
            background-color: white;
            box-shadow: 0px 0px 24px rgba(0, 0, 0, 0.250);

            width: 450px;
            height: 500px;
            margin: 30px auto;

            display: flex;
            flex-direction: column;
            align-items: center;

            border-radius: 20px;
        }

        nav > a{
            font-family: "Courier Prime", monospace;
            font-size: 16px;
            text-decoration: none;
            color: #AAAAAA;

            margin: 0px 33px 0px 33px;
        }

        nav > a:hover{
            text-decoration: underline;
        }

        div#div1 > a{
            text-decoration: none;
            font-size: 16px;
        }

        div#div1 > input{
            font-family: "Inter", sans-serif;
        }

        div#div1 > a:hover{
            text-decoration: underline;
        }


        input.Email{
        border: none;
        border-bottom: 1px solid rgba(0, 0, 0, 0.500);
        outline: none;
        width: 300px;

        font-family: "Inter", sans-serif;
        font-size: 16px;

        margin: 0px 161px 53px 161px;
        padding: 0px 0px 11px 0px;
        }

        input.Email::placeholder{
        color: rgba(0, 0, 0, 0.500);
        text-align: center;
        }

        input.Senha{
        border: none;
        border-bottom: 1px solid rgba(0, 0, 0, 0.500);
        outline: none;
        width: 300px;

        font-family: "Inter", sans-serif;
        font-size: 16px;

        margin: 0px 201px 33px 201px;
        padding: 0px 0px 11px 0px;
        }

        input.Senha::placeholder{
        color: rgba(0, 0, 0, 0.500);
         text-align: center;
        }

        input.bottomLogin{
        font-family: "Inter", sans-serif;
        background-color: #36C3FF;
        border: none;
        color: white;
        border-radius: 20px;
        font-weight: 300;

        /* Mantive o flex, mas o correto é definir display flex no pai.
       Se você quer centralizar o texto, use text-align/line-height */
        display: inline-block;
        text-align: center;
        line-height: 35px;

        margin: 0 175px 41px 175px;
        width: 100px;
        height: 35px;

        cursor: pointer;        /* mostra o ponteiro */
        position: relative;     /* necessário p/ z-index */
        z-index: 10;            /* garante que fique acima */
        } 
            /* Efeito botão */
        .toggle {
        position: relative;
        width: 132px;
        height: 37px;
        margin: 59px 155px 73px 155px;

        background: #fff;
        border-radius: 20px;
        box-shadow: inset 0 0px 8px rgba(0, 0, 0, 0.250);

        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0px 8px;
        }

            .option {
            flex: 1;
            text-align: center;
            font-size: 14px;
            color: #000000;
            cursor: pointer;
            z-index: 2;
            user-select: none;
            transition: color 0.3s;
            line-height: 37px;
            }

            .slider {
            position: absolute;
            top: 0;
            left: 0;
            height: 37px;
            width: 86px;              /* largura da parte azul */
            background: #27BEFF;
            border-radius: 37px;
            transition: left 0.3s;
            z-index: 1;
            }

            input[type="radio"] {
            display: none;
            }

            /* Quando "Usuário" está selecionado */
            #usuario:checked ~ .slider {
            left: 0;
            }
            #usuario:checked ~ label[for="usuario"] {
            color: #fff;
            }

            /* Quando "ONG" está selecionado */
            #ong:checked ~ .slider {
            left: calc(140px - 70px); /* Mudando tamanho do botão azul */
            width: 78px;
            }
            #ong:checked ~ label[for="ong"] {
            color: #fff;
            }

            form{
                text-align: center;
            }
    </style>

</head>
<body>
    <header>
        <nav>   
            <a href="HomePage.html">Home</a>
            <a href="HomePage.html">Sobre</a>
            <a style="margin-right: 72px;" href="#">F.A.Q</a>
        </nav>
    </header>
    <div id="container">
        <div id="containerImagemEDiv">
            <div style="margin: 0px auto;">
                <a href="HomePage.html">
                    <img src="imagens/DetalhesAnimal/logoMelhor.png" alt="Logo" style="width: 104px; height: 90px; margin: 0px auto;">
                </a>
            </div>
            <div id="div1">
                <div class="toggle">
                    <input type="radio" id="usuario" name="toggle" checked>
                    <input type="radio" id="ong" name="toggle">
    
                    <div class="slider"></div>
    
                    <label class="option" for="usuario">Usuário</label>
                    <label class="option" for="ong">ONG</label>
                </div>
                <form action="/" method="post">
                    <input class="Email" type="text" name="login" autocomplete="off" tabindex="0" placeholder="Digite seu e-mail">
                    <input class="Senha" type="password" name="password" autocomplete="off" tabindex="0" placeholder="Senha">
                    <input class="bottomLogin" type="submit" value="Log in" />
                </form>
                <a href="CadastroAnimal.html" style="color: black; font-weight: bold; margin: 0px 173px 22px 173px;">Cadastrar-se</a>
                <a href="#" style="color: rgba(0, 0, 0, 0.500); ">Esqueceu a senha?</a>
            </div>
        </div>
        <img src="./imagens/cachorro.png" alt="cachorro">
    </div>
</body>
</html>
