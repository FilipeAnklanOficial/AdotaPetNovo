<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro Usuário</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");
      body {
        font-family: "Inter", "Courier Prime", sans-serif;
        margin: 0px;
      }

      header {
        width: 100%;
        padding: 38px 0px 17px 0px;
      }

      nav {
        height: 18px;
        text-align: end;
      }

      #container {
        width: 100%;
        height: fit-content;

        background-color: white;
        align-items: center;
        justify-content: center;
        display: flex;
      }

      div#containerImagemEDiv {
        background-color: white;
        display: flex;
        flex-direction: column;
      }

      img {
        width: 629px;
        height: 929px;

        margin: 0px 0px 2px 506px;
      }

      #divCadastro {
        font-family: "Inter", sans-serif;
        background-color: white;
        box-shadow: 0px 0px 24px rgba(0, 0, 0, 0.25);

        width: auto;
        height: 100%;
        margin: 30px auto;
        padding: 30px 30px;

        display: flex;
        flex-direction: column;
        align-items: center;

        border-radius: 20px;
      }

      nav > a {
        font-family: "Courier Prime", monospace;
        font-size: 16px;
        text-decoration: none;
        color: #aaaaaa;

        margin: 0px 33px 0px 33px;
      }

      nav > a:hover {
        text-decoration: underline;
      }

      div#divCadastro > a {
        text-decoration: none;
        font-size: 16px;
      }

      div#divCadastro a {
        text-decoration: none;
      }

      div#divCadastro a:hover {
        text-decoration: underline;
      }

      div#divCadastro > h1 {
        font-size: 32px;
        font-weight: 700;

        margin: 0px;
        align-self: flex-start;
      }

      form label,
      label#nomeCompleto {
        display: block;
        text-align: left;
        margin: 20px 0 10px 0;
        font-size: 16px;
      }

      label#nomeCompleto {
        margin: 0px 0 10px 0;
      }

      form input,
      input#nomeCompleto{
        background-color: rgba(0, 0, 0, 0.08);

        border-radius: 25px;
        border: none;
        transition: border-color 0.25s ease;
        border: 3px solid transparent;

        padding: 10px 12px;

        font-size: 16px;
      }

      form input{
        height: 25px;
        width: 87%;
      }

      input#nomeCompleto {
        height: 25px;
        width: 95%;
      }

      form input:focus,
      input#nomeCompleto:focus {
        border-color: #36c3ff;
        outline: none;
      }

      input::placeholder {
        color: rgba(0, 0, 0, 0.5);
        text-align: left;
      }

      button.buttonCadastro {
        background-color: #36c3ff;
        color: white;

        border-radius: 20px;
        border: none;

        font-family: "Inter", sans-serif;
        font-weight: 300;

        /* Mantive o flex, mas o correto é definir display flex no pai.
       Se você quer centralizar o texto, use text-align/line-height */
        text-align: center;
        margin: 32px 0px 41px 0px;
        width: 100px;
        height: 35px;

        cursor: pointer; /* mostra o ponteiro *//
      }

      /* Efeito botão */
      .toggle {
        position: relative;
        width: 132px;
        height: 37px;
        margin: 32px 0px 32px 0px;

        background: #fff;
        border-radius: 20px;
        box-shadow: inset 0 0px 8px rgba(0, 0, 0, 0.25);

        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0px 8px;
      }

      .option {
        flex: 1;
        text-align: center;
        font-size: 14px;
        color: #000000;
        cursor: pointer;
        z-index: 2;
        user-select: none;
        transition: color 0.3s;
        line-height: 37px;
      }

      .slider {
        position: absolute;
        top: 0;
        left: 0;
        height: 37px;
        width: 86px; /* largura da parte azul */
        background: #27beff;
        border-radius: 37px;
        transition: left 0.3s;
        z-index: 1;
      }

      input[type="radio"] {
        display: none;
      }

      /* Quando "Usuário" está selecionado */
      #usuario:checked ~ .slider {
        left: 0;
      }
      #usuario:checked ~ label[for="usuario"] {
        color: #fff;
      }

      /* Quando "ONG" está selecionado */
      #ong:checked ~ .slider {
        left: calc(140px - 70px); /* Mudando tamanho do botão azul */
        width: 78px;
      }
      #ong:checked ~ label[for="ong"] {
        color: #fff;
      }

      form#meuFormContainer {
        margin: 0px;
        padding: 0px;
        gap: 20px;

        display: flex;
        flex-direction: row;
        justify-content: center;

        width: 100%;
      }

      div#meuFormEsquerdo,
      div#meuFormDireito {
        margin: 0px;
        padding: 0px;

        text-align: center;
        flex-direction: column;
        width: 100%;
      }

      #divCadastro p {
        width: 100%;
        text-align: center;
        margin: 20px 0 0 0;
      }

      #divCadastro p > a {
        color: black;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="HomePage.html">Home</a>
        <a href="HomePage.html">Sobre</a>
        <a style="margin-right: 72px" href="#">F.A.Q</a>
      </nav>
    </header>
    <div id="container">
      <div id="containerImagemEDiv">
        <div style="margin: 0px auto">
          <a href="HomePage.html">
            <img
              src="imagens/DetalhesAnimal/logoMelhor.png"
              alt="Logo"
              style="width: 104px; height: 90px; margin: 0px auto"
            />
          </a>
        </div>
        <div id="divCadastro">
          <h1>Crie sua conta</h1>
          <div class="toggle">
            <input type="radio" id="usuario" name="toggle" checked />
            <input type="radio" id="ong" name="toggle" />
            <div class="slider"></div>

            <label class="option" for="usuario">Usuário</label>
            <label class="option" for="ong">ONG</label>
          </div>
          <label id="nomeCompleto" for="nomeCompleto" style="text-align: left"
            >Nome completo</label
          >
          <input
            id="nomeCompleto"
            type="text"
            name="nomeCompleto"
            placeholder="Seu nome completo"
          />
          <form id="meuFormContainer" action="/" method="post">
            <div id="meuFormEsquerdo">
              <label for="cpf">CPF</label>
              <input
                type="text"
                name="cpf"
                autocomplete="off"
                tabindex="0"
                placeholder="Digite seu CPF"
              />
              <label for="login">Telefone</label>
              <input
                type="tel"
                name="login"
                autocomplete="off"
                tabindex="0"
                placeholder="(xx) xxxxx-xxxx"
              />
              <label for="password">Senha</label>
              <input
                type="password"
                name="password"
                autocomplete="off"
                tabindex="0"
                placeholder="●●●●●●●"
              />
            </div>
            <div id="meuFormDireito">
              <label for="nomeUsuario">E-mail</label>
              <input
                type="email"
                name="email"
                autocomplete="off"
                tabindex="0"
                placeholder="Digite seu e-mail"
              />
              <label for="login">Data de Nascimento</label>
              <input
                type="date"
                name="dataNascimento"
                autocomplete="off"
                tabindex="0"
              />
              <label for="password">Confirmar Senha</label>
              <input
                type="password"
                name="password"
                autocomplete="off"
                tabindex="0"
                placeholder="●●●●●●●"
              />
            </div>
          </form>
          <button class="buttonCadastro" type="button" value="Cadastrar">
            Cadastrar
          </button>
          <p>
            Já tem uma conta?
            <a href="login.html">Fazer login</a>
          </p>
        </div>
      </div>
      <img src="./imagens/cachorro.png" alt="cachorro" />
    </div>
  </body>
</html>
